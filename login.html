<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kayotic Kreations Login</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="admin-body login-body">
    <main class="login-shell">
      <form class="login-card" id="login-form">
        <p class="eyebrow">Protected CMS</p>
        <h1>Kayotic Kreations</h1>
        <p>Sign in to edit the site content.</p>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <button class="button primary" type="submit">Sign in</button>
        <span class="save-status" id="login-status"></span>
      </form>
    </main>

    <script src="login.js"></script>
  </body>
</html>
